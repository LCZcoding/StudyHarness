spring:
  application:
    name: study-harness
  profiles:
    active: local
  ai:
    mcp:
      client:
        stdio:
          servers-configuration: classpath:mcp-servers.json

  servlet:
    multipart:
      max-file-size: 5MB       # PDF 带图很容易上 MB，100KB 会连正常讲义都传不进来
      max-request-size: 6MB
#        sse:
#          connections:
#            server1:
#              url: http://localhost:8127
app:
  ai:
    context:
      max-history-chars: 8000
  pgvector:
    enabled: true # 开关，false表示不再自动入库，避免重启文件重复入库

server:
  port: 8123
  servlet:
    context-path: /api
# springdoc-openapi配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.lcz.aiagentstudy.controller
# knife4j增强配置
knife4j:
  enable: true
  setting:
    language:
# 开启工具debug模式
logging:
  level:
    org.springframework.ai: DEBUG
    com.lcz.aiagentstudy.chatmemory: DEBUG

